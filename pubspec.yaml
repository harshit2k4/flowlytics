name: flowlytics
description: "Privacy-centric period tracker with smart cycle predictions, built
  in Flutter."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  crypto: ^3.0.7
  encrypt: ^5.0.3
  file_picker: ^8.0.0
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.0.0
  flutter_native_splash: ^2.4.7
  flutter_timezone: ^3.0.1
  get: ^4.7.3
  google_fonts: ^7.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  local_auth: ^2.3.0
  lottie: ^3.1.0
  material_symbols_icons: ^4.2892.0
  path_provider: ^2.1.5
  pdf: ^3.11.1
  permission_handler: ^11.3.1
  printing: ^5.13.2
  share_plus: ^10.1.0
  table_calendar: ^3.2.0
  timezone: ^0.9.4

dev_dependencies:
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
flutter:
  uses-material-design: true

  fonts:
    - family: CrimsonText
      fonts:
        - asset: assets/fonts/CrimsonText-Regular.ttf
        - asset: assets/fonts/CrimsonText-Bold.ttf
          weight: 700
        - asset: assets/fonts/CrimsonText-Italic.ttf
          style: italic
  assets:
    - assets/animations/cat_animation.json

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/flowlytics_colored.png"
  
  # Adaptive Icon Settings (The "Classic" Pink-Red Background)
  adaptive_icon_background: "#D81B60" 
  adaptive_icon_foreground: "assets/icons/flowlytics_colored.png"
  
  # Themed Icon (Uses transparent version)
  adaptive_icon_monochrome: "assets/icons/flowlytics_transparent.png"

flutter_native_splash:
  color: "#D81B60"
  image: "assets/icons/flowlytics_colored.png"
  
  # Crucial for some heavily skinned OEMs
  android_12:
    image: "assets/icons/flowlytics_colored.png"
    icon_background_color: "#D81B60"
    
  # Prevents the screen from going black before Flutter draws
  fullscreen: true