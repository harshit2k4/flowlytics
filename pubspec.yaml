name: flowlytics
description: "Privacy-centric period tracker with smart cycle predictions, built
  in Flutter."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  get: ^4.7.3
  google_fonts: ^7.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  material_symbols_icons: ^4.2892.0
  path_provider: ^2.1.5

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
flutter:
  uses-material-design: true
